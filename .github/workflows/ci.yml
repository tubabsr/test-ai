name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that publish request packages:write explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a publish on main or a tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile sources and tests
        run: python -m compileall -q sre_agent tests

      # The analysis core is standard-library only, so no install step is needed.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  validate:
    name: Validate manifests, dashboards, and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Parse Kubernetes and Prometheus YAML
        run: |
          python - <<'EOF'
          import yaml
          for path in ["deploy/k8s.yaml", "deploy/prometheus-rules.yaml"]:
              with open(path) as fh:
                  docs = [d for d in yaml.safe_load_all(fh) if d is not None]
              assert docs, f"{path} is empty"
              for doc in docs:
                  assert "apiVersion" in doc and "kind" in doc, f"{path}: document missing apiVersion/kind"
              print(f"{path}: {len(docs)} document(s) ok")
          EOF

      - name: Parse Grafana dashboard JSON
        run: python -m json.tool deploy/grafana-dashboard.json > /dev/null && echo "grafana json ok"

      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'EOF'
          import pathlib, re
          html = pathlib.Path("dashboard/index.html").read_text(encoding="utf-8")
          script = re.search(r"<script>(.*)</script>", html, re.S).group(1)
          pathlib.Path("/tmp/dashboard.js").write_text(script, encoding="utf-8")
          EOF
          node --check /tmp/dashboard.js && echo "dashboard js ok"

  image:
    name: Build, scan, and publish image
    needs: [test, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # needed to push to GHCR; pull requests from forks get read-only tokens
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Build and load locally first, so the scan and smoke test run on exactly
      # the image that gets published.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the container
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="$(printf '%s\n' "$TAGS" | head -n 1)"
          docker run -d --name sre-agent -p 8080:8080 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "service never became healthy"
              docker logs sre-agent
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok"'
          docker logs sre-agent | tail -n 20
          docker rm -f sre-agent

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pushing $tag"
            docker push "$tag"
          done
